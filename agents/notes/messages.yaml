# Replies are written by code from these templates, not by the LLM
# (ADR-0008 in AGENTS.md).
tr:
  added: "📝 Not aldım (#{id}): {title}{tags}"
  appended: "✏️ #{id} · {title} notuna ekledim: {text}"
  header: "📝 Notlar{about} ({count}):"
  header_more: "… ve {more} not daha. Daha dar ara: bir etiket ya da kelime söyle."
  show_hint: "İçeriğini görmek için: \"#numara notunu göster\""
  empty: "Henüz not yok."
  none_found: "{about} için not bulamadım."
  deleted: "🗑️ Sildim: {titles}"
  deleted_all: "🗑️ Tüm notları sildim ({count})."
  which: "Hangi notu sileyim? Numarasını yazar mısın?"
  not_found: "\"{entry}\" diye bir not bulamadım."
  ambiguous: "\"{entry}\" birden çok notla eşleşiyor; numarasını yazar mısın? ({ids})"
en:
  added: "📝 Noted (#{id}): {title}{tags}"
  appended: "✏️ Added to note #{id} · {title}: {text}"
  header: "📝 Notes{about} ({count}):"
  header_more: "… and {more} more. Narrow it down: give a tag or a word."
  show_hint: "To read one: \"show note #number\""
  empty: "No notes yet."
  none_found: "No notes for {about}."
  deleted: "🗑️ Deleted: {titles}"
  deleted_all: "🗑️ Deleted all notes ({count})."
  which: "Which note should I delete? Can you give its number?"
  not_found: "I couldn't find a note \"{entry}\"."
  ambiguous: "\"{entry}\" matches several notes; which number? ({ids})"
