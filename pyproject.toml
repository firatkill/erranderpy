[project]
name = "erranderpy"
version = "0.0.1"
description = "Small personal agents you talk to on Telegram."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-telegram-bot[job-queue]>=22.8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erranderpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real LLM API (needs an API key, costs a fraction of a cent)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
