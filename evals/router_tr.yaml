# Router eval: does the model send each request to the right agent?
# `expect` is the list of agents, order does not matter. Optional `requests: N`: how many
# separate requests the router must find (the multi-request check needs 2+).
# Never copy these sentences into a prompt (see "Evals" in AGENTS.md).
suite: router
cases:
  # --- shopping -----------------------------------------------------------
  - {id: r01, message: "zeytinyağı almam lazım", expect: [shopping]}
  - {id: r02, message: "2 paket makarna, bir de süt", expect: [shopping]}
  - {id: r03, message: "makarnayı aldım", expect: [shopping]}
  - {id: r04, message: "alışveriş listemde neler var?", expect: [shopping]}
  - {id: r05, message: "deterjan bitmiş", expect: [shopping]}
  - {id: r06, message: "domatesi listeden çıkar, evde varmış", expect: [shopping]}
  - {id: r07, message: "markete gidince peynir ve zeytin al", expect: [shopping]}
  - {id: r08, message: "tuvalet kağıdı", expect: [shopping]}
  # --- tasks --------------------------------------------------------------
  - {id: r09, message: "bundan sonra günde 1 saat ingilizce çalışacağım", expect: [tasks]}
  - {id: r10, message: "bugün 30 dk ingilizce çalıştım", expect: [tasks]}
  - {id: r11, message: "yarın faturayı öde", expect: [tasks]}
  - {id: r12, message: "bugün ne kaldı?", expect: [tasks]}
  # r13 had no history at first and flip-flopped between tasks/shopping/unknown: alone, the
  # sentence really is ambiguous. In real use the earlier turn is always there (2026-11-04).
  - id: r13
    message: "faturayı ödedim"
    history:
      - [user, "yarın faturayı öde"]
      - [assistant, "📌 Ekledim: faturayı öde (yarın)."]
    expect: [tasks]
  - {id: r14, message: "her sabah 10 dakika esneme yapmak istiyorum", expect: [tasks]}
  - {id: r15, message: "kitap okumaya 45 dakika ayırdım bugün", expect: [tasks]}
  - {id: r16, message: "perşembe kuaföre gitmeyi hatırlat", expect: [tasks]}
  - {id: r17, message: "yarın için planım ne", expect: [tasks]}
  - {id: r18, message: "annemi aramam lazım bugün", expect: [tasks]}
  # --- tricky: shopping words inside a task, and vice versa ----------------
  - {id: r19, message: "yarın markete gitmeyi unutmayayım", expect: [tasks]}
  - {id: r20, message: "ingilizce kitabı almam lazım", expect: [shopping]}
  - {id: r21, message: "süt şu an kaç lira?", expect: [unknown]}
  - {id: r22, message: "süt aldım mı ben?", expect: [shopping]}
  # --- several requests in one message -----------------------------------
  - {id: r23, message: "zeytinyağı al, bir de bugün 20 dk ingilizce çalıştım", expect: [shopping, tasks]}
  - {id: r24, message: "ekmeği aldım, yarın da kargoyu teslim almayı ekle", expect: [shopping, tasks]}
  - {id: r25, message: "bugün 1 saat kitap okudum ve kahve bitti", expect: [tasks, shopping]}
  - {id: r26, message: "pil al, yarın da pilleri değiştirmeyi hatırlat", expect: [shopping, tasks]}
  # --- unknown ------------------------------------------------------------
  - {id: r27, message: "selam", expect: [unknown]}
  - {id: r28, message: "bugün hava nasıl olacak?", expect: [unknown]}
  - {id: r29, message: "hmm", expect: [unknown]}
  - {id: r30, message: "teşekkürler, harikasın", expect: [unknown]}
  # --- from real use (each message the bot got wrong becomes a case) -------
  - {id: r31, message: "Her gün 30dk ingilizce okuma yapmam lazım. Ayrıca diksiyon alıştırmaları yapmalıyım", expect: [tasks]}
  # --- builder: no agent can do it -> offer a new ability (Stage 3) ---------
  - {id: r32, message: "11 kasımda saat 2'de avm'ye gitmem gerek", expect: [builder]}
  - {id: r33, message: "okuduğum kitapları da takip edebilir misin", expect: [builder]}
  - {id: r34, message: "yarın 15:30'da dişçi randevum var", expect: [builder]}
  - id: r35
    message: "evet"
    history:
      - [user, "harcamalarımı tutmanı istiyorum"]
      - [assistant, "🧩 Yeni yetenek önerisi: 💸 Harcamalar\nHer harcama için: açıklama (metin, zorunlu) · tutar (sayı, zorunlu) · tarih (tarih)\n\nEkleyeyim mi? Değiştirmek istediğin bir şey varsa söyle."]
    expect: [builder]
  # still the old agents: a whole-day to-do is a task, not a new ability
  - {id: r36, message: "cumartesi arabayı yıkatmam lazım", expect: [tasks]}
  # from real use (Telegram, 2026-11-04)
  - id: r37
    message: "Ekle"
    history:
      - [user, "5 kasımda saat 1.30 da toplantım var"]
      - [assistant, "🧩 Yeni yetenek önerisi: 📅 Takvim\nHer etkinlik için: etkinlik (metin, zorunlu) · tarih ve saat (tarih-saat, zorunlu) · notlar (metin)\n\nEkleyeyim mi? Değiştirmek istediğin bir şey varsa söyle."]
    expect: [builder]
  - {id: r38, message: "Listedekilerin tümünü temizle.", expect: [shopping]}
  - id: r39
    message: "geri al"
    history:
      - [user, "listeyi boşalt"]
      - [assistant, "🧹 Listeyi temizledim (5 ürün: ekmek, cips, kola, domates, yoğurt). Yanlışlıkla olduysa \"geri al\" yaz."]
    expect: [shopping]
  # --- notes (Stage 5, the agent added from the template) and its borders ---
  - {id: r40, message: "bunu bir yere yaz: kiracı ödemeyi her ayın 15'inde yapacak", expect: [notes]}
  - {id: r41, message: "dizi önerisi geldi, The Bear, ablam çok beğenmiş", expect: [notes]}
  - {id: r42, message: "tarif notlarımda neler var", expect: [notes]}
  - {id: r43, message: "yarın faturayı ödemeyi unutma", expect: [tasks]}
  - {id: r44, message: "deterjan bitmiş", expect: [shopping]}
  - {id: r45, message: "fikir: haftalık bütçe uygulaması yapmak. bir de süt al", expect: [notes, shopping]}
  # Live (2026-11-05): two actions for one agent with a pasted note; must be 2 requests (checked in runtime).
  - {id: r46, message: "notları tamamen temizle, sonra yeni bir not olarak şunu ekle:\n\nDiksiyon çalışması:\nLar\nLer\n\n1: Kırk kırık küp kırkınında kulbu kırık kırk kara küp.", expect: [notes], requests: 2}
  # Live (2026-11-05): one verb, two habits; must be 2 requests so a missed one is caught.
  - {id: r47, message: "ingilizce okuma ve diksiyon alıştırmalarını tamamladım", expect: [tasks], requests: 2}
  - {id: r48, message: "süt, yumurta ve peynir al", expect: [shopping], requests: 1}
