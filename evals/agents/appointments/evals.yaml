cases:
  # from real use: the request for a reminder ended up in the notes field and nothing was scheduled
  - id: apt01
    message: "11 kasım saat 15.00 için google meet toplantısı için hatırlatma ekler misin"
    expect: {tool: add_entry, args: {title: "~meet", when: "~-11-11 15:00", remind_before_minutes: 60}}
  - id: apt02
    message: "1 saat önce hatırlat"
    history:
      - [user, "8 kasım 15:00 google meet toplantısı"]
      - [assistant, "📅 Kaydettim (#2): Google Meet toplantısı · 08.11 Pazar 15:00. ⏰ Hatırlatma ister misin? Örneğin \"1 saat önce hatırlat\" yazman yeterli."]
    expect:
      any:
        - {tool: update_entry, args: {entry: "~2", remind_before_minutes: 60}}
        - {tool: update_entry, args: {entry: "~meet", remind_before_minutes: 60}}
  - id: apt03
    message: "yarın 10:00'da dişçi"
    expect: {tool: add_entry, args: {title: "~dişçi", when: "~10:00", remind_before_minutes: null}}
  # from a replay of real use: the model listed first, and listing ended the turn
  - id: apt04
    message: "11 kasımdaki toplantıyı 9 kasıma al"
    history:
      - [user, "11 kasım 15:00 google meet toplantısı"]
      - [assistant, "📅 Kaydettim (#1): Google Meet toplantısı · 11.11 Çarşamba 15:00."]
      - [user, "8 kasım 16:00 dişçi"]
      - [assistant, "📅 Kaydettim (#2): Dişçi · 08.11 Pazar 16:00."]
    # only the new date (the code keeps 15:00), or the full date-time; never 00:00
    expect: {tool: update_entry, args: {when: 're:\d{4}-11-09( 15:00)?'}}
  # from real use (Telegram, 2026-11-04 20:57): two requests for this agent in one message;
  # only the first was done and the second was silently dropped
  - id: apt05
    message: "14 kasım saat 14.00 için bir toplantım var. takvime ekle. ayrıca 8 kasımdaki toplantı için bir hatırlatma kurar mısın"
    requests:  # how the router splits it (5/5 in a check)
      - "14 kasım saat 14.00 için bir toplantım var. takvime ekle."
      - "8 kasımdaki toplantı için bir hatırlatma kurar mısın"
    history:
      - [user, "8 kasım 15:00 google meet toplantısı"]
      - [assistant, "📅 Kaydettim (#2): Google Meet toplantısı · 08.11 Pazar 15:00. ⏰ Hatırlatma ister misin? Örneğin \"1 saat önce hatırlat\" yazman yeterli."]
    expect:
      calls:
        - {tool: add_entry, args: {when: "~-11-14 14:00"}}
        - {tool: update_entry, args: {remind_before_minutes: 60}}
  # from real use (Telegram, 2026-11-05 03:55): the meeting was saved a day earlier and is no
  # longer in the chat history. The agent didn't know it existed and saved a new entry at 00:00.
  - id: apt06
    message: "8 kasımdaki toplantı için 1 saat önce hatırlat"
    entries:  # already saved (#1, #2, #3)
      - {title: "Toplantı", when: "2026-11-05 14:00", notes: "Google Meet üzerinden"}
      - {title: "Google Meet toplantısı", when: "2026-11-08 15:00"}
      - {title: "Toplantı", when: "2026-11-14 14:00", remind_before_minutes: 180}
    history:
      - [user, "Her gün sayısal loto oynamalıyım"]
      - [assistant, "🔁 Yeni alışkanlık: sayısal loto oynama."]
    expect: {tool: update_entry, args: {entry: 're:#?2', remind_before_minutes: 60}}
